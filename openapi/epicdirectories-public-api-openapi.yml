          description: 'What this directory accepts from anonymous strangers. MERGED into the stored policy, not replaced — an absent switch keeps its current value, and keys this DTO does not declare (such as `rejectionReasons`) are preserved. That is the opposite of `listingTypes` above, deliberately: removing a listing type has no other expression, whereas turning one switch off must not silently clear the rest of the object.'

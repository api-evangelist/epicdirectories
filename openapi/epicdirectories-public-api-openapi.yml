          - enrichment
        input:
          type: object
          description: 'Job input, passed through to the processor. Shape depends on `jobType` — an `import` wants `{ config: { listingType, ... } }`. Validated by the processor rather than here: `inputJson` is stored as sent, so a malformed input surfaces as a job that fails with a reason rather than a request that 400s and leaves no record.'
      required:

  /public/v1/directories/{directory}/export:
    get:
      operationId: PublicApiController_exportDirectory
      summary: Full-directory export for static-site builds
      description: 'Everything a build needs in one call: directory config + listingTypes, attribute templates, taxonomies with all terms (including `metadata.synonyms`), recipes, and listings with their attributes, terms, and **all** ready media (the browse endpoints cap media at 5 per listing).


        **Keyset pagination, not offset.** Loop until `pagination.nextCursor` is null, passing it back as `?cursor=`. Offset pagination is wrong here: an export can run for many seconds while writes land, and a shifting ordering key would silently skip or duplicate rows. Ordered by `id` ascending.


        Default page size 500, max 1000 — larger than the 100 cap on browse endpoints because this is a build-time bulk pull. The fixed sections (directory, schema, taxonomies, recipes) repeat on every page so each page is independently usable; pass `listings=false` to fetch only those, e.g. to generate routes before pulling content.


        Each media row carries `source` + `sourceRef`, the same provenance pair `GET .../media` returns, so a build can join our delivery copies back to its own catalogue in one bulk pull. `sourceRef` holds the external URL the asset was created from, **except** when `source` is `upload` or `screenshot` — those two are rewritten with an internal R2 object key once the bytes are stored, and only those two. Treat it as a denylist, not an allowlist: `source` is free-form (see POST .../media), so callers set their own values like `official_site`, and an allowlist of known sources silently skips them. Do not sniff whether the value looks like a URL either — branch on `source`.


        Each listing carries `websiteUrl`: its own site, resolved server-side, or `null`. Prefer it over reading `canonicalFields` yourself — the value lives under one of several keys (`website`, `url`, `homepage`, `organizerWebsite`) and a `series_of` child inherits its series'', which you cannot reproduce from this response because it carries `parentSlug` rather than the parent''s fields. It is also the URL our probes fetched, so a `site-dead` screening term is a verdict about this link and no other.


        Unpublished listings require the `read:drafts` scope, same as every other read.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Listings per page (default 500, max 1000)
        schema:
          type: number
      - name: cursor
        required: false
        in: query
        description: Listing id from a previous response's `pagination.nextCursor`
        schema:
          type: string
      - name: listings
        required: false
        in: query
        description: Set to `false` to omit listings and return only config/schema/taxonomies/recipes
        schema:
          type: string
      - name: fields
        required: false
        in: query
        description: Comma-separated dotted paths to project on each listing (e.g. `slug,title,geo.city`). Applies to listings only — the fixed schema sections come back whole.
        schema:
          type: string
      responses:

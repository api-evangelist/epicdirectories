components:
  schemas:
    PublicSubmissionPolicyDto:
      type: object
      properties:
        suggestions:
          type: boolean
          description: Accept anonymous listing suggestions. Each one lands as `pending` for review.
        feedback:
          type: boolean
          description: Accept anonymous feedback on an existing listing.
        reviews:
          type: boolean
          description: Accept anonymous reviews — star-rated, and an approved one moves the listing average.
        comments:
          type: boolean
          description: 'Accept anonymous page comments — unrated, keyed by page path. Independent of `reviews` on purpose: a site can want reader discussion without public star ratings.'
    SweepProbesDto:
      type: object
      properties:
        kind:
          type: string
          description: 'What to check.


            - `link` (default) — **does this URL resolve?** Keyed per URL, because a host-level answer cannot see a dead path on a live domain. This is what `dead-links` reads.

            - `site` — **what does this page say?** Captures title, description, headings, body text and signals. Keyed per host and shared across directories, so two directories listing the same company pay for one probe.


            They are not interchangeable and neither implies the other. A directory can have every URL confirmed alive and no captured content at all — which is exactly the state EpicWebDesigners was in when this parameter was added.'
          enum:
          - link
          - site
          default: link
        limit:
          type: number
          description: 'How many probes to queue this run. Capped at 500 regardless of what you send — probing costs are pooled across every consumer, so one directory cannot drain the budget for the rest. The response reports `deferred` when the cap bit, and successive runs rotate: candidates are ordered oldest-checked first, so a directory larger than the cap is eventually covered rather than stuck on the same slice.'
          minimum: 1
          maximum: 500
          default: 500
        force:
          type: boolean
          description: 'Re-check URLs whose record is still current. Off by default, so a repeated sweep only covers what has gone stale and is cheap to run on a schedule.


            Use it when the checker itself changed and existing verdicts were computed by the old one.'
          default: false
    CreatePublicListingDto:
      type: object
      properties:
        listingType:
          type: string
          description: Listing type slug (must be defined on the directory)
        slug:
          type: string
          description: URL-friendly slug (unique within directory + listingType)
        title:
          type: string
          description: Display title
        status:
          type: string
          description: Lifecycle status
          enum:
          - draft
          - published
          - hidden
          default: draft
        parentId:
          type: object
          description: Parent listing UUID — the id returned on any read. Mutually exclusive with parentSlug; sending both is a 400. Must belong to the same directory. On PATCH, send `null` to detach the listing from its parent.
        parentSlug:
          type: string
          description: Parent listing slug (resolved within the same directory). Requires parentListingType whenever the parent is a different type than this listing — which, for the series/event hierarchy, is always. Prefer parentId if you have it.
        parentListingType:
          type: string
          description: Parent listing type. Defaults to this listing's type when omitted.
        relationshipType:
          type: string
          description: Relationship type to parent (e.g. series_of, brand_of, chapter_of)
        geo:
          type: object
          description: 'Geographic data. **Full-replace on PATCH** — sending `{ geo: { lat: 36.17 } }` wipes every other geo key. To partially update, GET the listing first and merge: `PATCH { geo: { ...existing.geo, lat: 36.17 } }`.


            **Recognized keys** (free-form JSON, but these are what the admin UI and adapters read):

            - `lat`, `lng` — numbers

            - `country` — ISO 3166-1 alpha-2, e.g. `US`

            - `admin1` — state/region as an ISO 3166-2 fragment, e.g. `OH`. **This is the state field** — `state` and `region` are NOT read, and using them leaves the admin Location section blank.

            - `city`, `streetAddress`, `postalCode`

            - `timezone` — IANA, e.g. `America/New_York`


            Any other key is stored and returned untouched, but nothing renders it.'
          example:
            country: US
            admin1: NV
            city: Las Vegas
            lat: 36.17
            lng: -115.14
        canonicalFields:
          type: object
          description: 'Canonical fields (queryable, indexable). Common keys: address, phone, email, website. **Full-replace on PATCH** — sending one key drops every other. Read-modify-write when partially updating.'
        editorialFields:
          type: object
          description: 'Editorial copy. Conventional keys: description, seoTitle, seoDescription, ogImage, noindex, canonicalUrl, synonyms, audiences, pricing. **Full-replace on PATCH** — sending `{ editorialFields: { seoTitle: "X" } }` wipes the description and every other key. Admin UI handles this by GET → spread → PATCH; third-party callers must do the same when partially updating.'
        publishAt:
          type:
          - object
          - 'null'
          description: Scheduled publish (ISO 8601). Listings with status:draft + publishAt in the past surface as published on read endpoints. Pass null to clear.
        taxonomies:
          type: object
          description: Taxonomy term assignments. Keys are taxonomy slugs; values are arrays of term slugs. Each taxonomy you list gets its assignments replaced — taxonomies you DON'T list are left alone (per-taxonomy partial-update). All slugs must exist or the whole request returns 400 with the unknown pairs (no partial writes). Use [] to clear a taxonomy.
          example:
            industries:
            - automotive-tradeshows
            regions:
            - north-america
      required:
      - listingType
      - slug
      - title

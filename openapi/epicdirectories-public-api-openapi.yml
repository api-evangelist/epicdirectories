        Listings that already have one are skipped unless you pass `force`, so re-running is cheap. Never-captured listings are queued before stale ones, so successive runs rotate through a directory bigger than the per-run cap instead of retrying the same slice forever.


        Respects `enrichmentPolicy.probe === false`, which short-circuits before anything is queued.


        **Sizing.** The `site` variant defaults to 400x267 — 400 wide at the capture''s own 3:2. Send `width` alone to change it and the height follows that aspect. To make a size stick across every sweep, set `enrichmentPolicy.screenshot` on the directory instead; `width`/`height` here override it for one run. The resolved geometry comes back as `siteVariant`.'

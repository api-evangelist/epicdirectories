      summary: Screenshot coverage for this directory
      description: 'How many listings have a screenshot, how many are still outstanding, and how many can never have one because they carry no website. `outstanding` is measured against `eligible`, not against the whole directory — a percentage of the total would read as a pipeline still catching up when in fact there is nothing left to do.


        `nextUp` is a 20-listing sample of what the next sweep would pick up, for spot-checking a run before committing browser time to it.


        **Requires the `read:drafts` scope**, unlike most reads: `nextUp` and `problems` name listings without filtering by status, so a draft''s slug and URL can appear in either.'

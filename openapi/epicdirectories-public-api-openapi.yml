    post:
      operationId: PublicApiController_createMedia
      summary: Attach an image to a listing from a URL
      description: 'Fetches the URL server-side, stores the original in R2 and queues variant generation, so the asset survives the source URL going away. Returns immediately with `status: "pending"`.'
      parameters:
      - name: Idempotency-Key
        in: header

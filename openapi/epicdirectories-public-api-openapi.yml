            - `country` — ISO 3166-1 alpha-2, e.g. `US`

            - `admin1` — state/region as an ISO 3166-2 fragment, e.g. `OH`. **This is the state field** — `state` and `region` are NOT read, and using them leaves the admin Location section blank.

            - `city`, `streetAddress`, `postalCode`

            - `timezone` — IANA, e.g. `America/New_York`


            Any other key is stored and returned untouched, but nothing renders it.'
          example:
            country: US
            admin1: NV
            city: Las Vegas
            lat: 36.17
            lng: -115.14
        canonicalFields:
          type: object
          description: 'Canonical fields (queryable, indexable). Common keys: address, phone, email, website. **Full-replace on PATCH** — sending one key drops every other. Read-modify-write when partially updating.'
        editorialFields:
          type: object
          description: 'Editorial copy. Conventional keys: description, seoTitle, seoDescription, ogImage, noindex, canonicalUrl, synonyms, audiences, pricing. **Full-replace on PATCH** — sending `{ editorialFields: { seoTitle: "X" } }` wipes the description and every other key. Admin UI handles this by GET → spread → PATCH; third-party callers must do the same when partially updating.'
        publishAt:
          type:
          - object
          - 'null'
          description: Scheduled publish (ISO 8601). Listings with status:draft + publishAt in the past surface as published on read endpoints. Pass null to clear.
        taxonomies:
          type: object
          description: Taxonomy term assignments. Keys are taxonomy slugs; values are arrays of term slugs. Each taxonomy you list gets its assignments replaced — taxonomies you DON'T list are left alone (per-taxonomy partial-update). All slugs must exist or the whole request returns 400 with the unknown pairs (no partial writes). Use [] to clear a taxonomy.
          example:
            industries:
            - automotive-tradeshows
            regions:
            - north-america
        slug:
          type: string
          description: 'New slug. Renaming **preserves the old slug as an alias**: every read that addresses this listing by the old `(listingType, slug)` keeps resolving, and answers with the new slug — so a consumer can compare the two and emit a 301 instead of serving the same listing at two live URLs. `GET .../listing-aliases` returns the whole redirect map for a directory in one call.


            Renaming back to a slug this listing previously used consumes that alias rather than creating a cycle. A slug held live, or held as an alias by a **different** listing, is a 409.'
          pattern: ^[a-z0-9-]+$
    ApplyScreeningDto:
      type: object
      properties:

  /public/v1/directories/{directory}/listings/{listingType}/{listingSlug}/enrich:
    post:
      operationId: PublicApiController_enrichListing
      summary: Enrich one listing from Google (geocode or Places)
      description: 'Runs synchronously and reports exactly what changed. **Only ever fills blanks** — an existing city, phone or website is never overwritten, so this is safe to re-run.


        `outcome` is `enriched`, `skipped` or `failed`, and a non-enriched result always carries a `reason`. Costs a Google API call per invocation, so it is not called implicitly by any other endpoint.



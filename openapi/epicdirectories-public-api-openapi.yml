        **Asynchronous.** The response reports what was queued; read the results from `GET .../site-probes/dead-links`.


        Candidates are ordered **oldest-checked first**, so successive runs rotate through a directory bigger than the per-run cap instead of re-checking the same slice forever.


        Respects `enrichmentPolicy.probe === false`, which short-circuits before anything is queued.'

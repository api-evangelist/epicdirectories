    get:
      operationId: PublicApiController_listJobs
      summary: List this directory's jobs
      description: 'Requires `read:drafts` or `write`. A job row carries `inputJson` and `errorJson`, which describe work on unpublished content, so this is gated with the same pair as the dead-link report — a monitoring cron should not need a key that can delete every listing just to poll progress.



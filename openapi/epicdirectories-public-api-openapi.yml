    EnrichListingDto:
      type: object
      properties:
        type:
          type: string
          description: 'What to run. `geocode` uses the Google Geocoding API; `google_places` looks the listing up in Places and stores the response as a `SourceSnapshot`. Defaults to `geocode`.


            `ai_description` is **not** offered: it is withdrawn, not pending.'
          enum:
          - geocode
          - google_places
          default: geocode
        direction:
          type: string
          description: 'Geocoding direction.

            - `auto` (default) — **reverse** when the listing already has `lat`/`lng` but is missing `city`, `postalCode`, `admin1` or `country`; **forward** when it has an address but no coordinates; skipped when it has both.

            - `forward` — address → coordinates.

            - `reverse` — coordinates → city / admin1 / postalCode / country. This is the one you want if you geocoded client-side and only need the administrative fields filled in.'
          enum:
          - auto
          - forward
          - reverse
          default: auto
        force:
          type: boolean
          description: Re-geocode a listing that already has coordinates. Off by default so a re-run is cheap and cannot overwrite hand-corrected coordinates. Even with `force`, existing non-coordinate values are never overwritten — enrichment only ever fills blanks.
          default: false
        externalId:
          type: string
          description: 'A Google **place id**, for `type: "google_places"` only. When supplied we fetch that exact place via Place Details instead of guessing with a text search.


            This is the difference between an exact lookup and a fuzzy one. Text search returns its best guess with no confidence score, so the result has to be confidence-gated — and the gate correctly refuses matches like "Business Organization Studio" → "Cozy Home Studios". If you already hold the id, that whole round trip is loss.


            The gate is skipped for an id lookup, because you asserted which place this is and there is nothing left to guess. If the returned place''s name disagrees with the listing, the response carries `nameMismatch` — the enrichment still applies, but a stale or mistyped id resolves to a real, wrong business and you should see that rather than have it written silently. Both `places/ChIJ…` and a bare `ChIJ…` are accepted.'
          example: ChIJN1t_tDeuEmsRUsoyG83frY4
    CreatePublicMediaDto:
      type: object
      properties:
        url:
          type: string
          description: 'Publicly reachable http(s) URL of the image. We fetch it server-side, store the original in R2, and queue variant generation — so the asset survives the source URL going away. The asset is created with `status: "pending"` and flips to `ready` once the original is stored; poll `GET .../media` to watch for it. `data:`, `file:` and private/link-local addresses are rejected with 400.'
          example: https://cdn.example.com/photos/acme-hall.jpg
        source:
          type: string
          description: Where the image came from, for provenance — e.g. `official_site`, `google_places`, `operator_supplied`. Free-form; defaults to `url`.
          example: official_site
        alt:
          type: string
          description: Alt text. Set it here — it is the one media field that affects both accessibility and image SEO, and it cannot be inferred from the file.
        caption:
          type: string
          description: Human-readable caption rendered near the image.
        role:
          type: string
          description: Disambiguates what the asset is FOR — consumers pick the page hero by this rather than by position. Closed set; anything else is rejected with 400 rather than silently stored.
          enum:
          - hero
          - thumbnail
          - gallery
          - logo
          - site_screenshot
          - site_og
          example: hero
        sortOrder:
          type: number
          description: Display order within the listing, ascending. Ties break on createdAt.
          minimum: 0
          default: 0
      required:
      - url
    UpdatePublicListingDto:
      type: object
      properties:
        title:

    post:
      operationId: PublicApiController_createJob
      summary: Enqueue a job
      description: 'Requires `write`. Enqueues `import` or `enrichment`.


        **The other three job types are refused with a 400 that names the route to use instead**, and not for security reasons — a key with `write` can already do more than any of them. Each would be a button that does nothing:

        - `recipe_build` / `recipe_rebuild_all` — recipe execution is not implemented. The processor used to sleep three seconds and mark the job `completed` with `pagesGenerated: 0`; that pretence was removed and it now refuses, so enqueueing one from here would reintroduce the same lie one layer up. `GET .../recipes/{recipe}` executes a recipe and returns the matches.

        - `media_process` — the media processor never updates its job row, so the row would sit at `queued` for ever whatever the work did. `POST .../media/{assetId}/reprocess` does this properly.


        Queue routing and retry policy are shared with the admin surface rather than reimplemented, so the two cannot drift on which queue a type lands in.'

      summary: Read the newest snapshot from one source
      description: 'Requires `read:drafts`, like the collection read above and for the same reason: a snapshot is raw upstream payload, and the safest key (`scopes: []`) must not reach it.


        This is the question the collection read was being used to answer, badly. "What did we last see from `google_places`?" meant pulling a page of snapshots — each carrying its full `payloadJson` — and throwing all but one away. On a listing with 40 snapshots of a 60 kB Places payload that is a 2.4 MB response to a one-row question.



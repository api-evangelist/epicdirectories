openapi: 3.2.0
info:
  title: EpicDirectories Public API
  description: API-first directory data platform.
  version: '1.0'
  contact: {}
servers:
- url: https://api.epicdirectories.com
  description: Production
- url: http://localhost:3333
  description: Local development
tags:
- name: Public
paths:
  /public/v1/directories/{directory}:
    get:
      operationId: PublicApiController_getDirectory
      summary: Get directory configuration and schema
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: Directory details with taxonomies and attribute templates
        '401':
          description: Missing or invalid X-API-Key
        '404':
          description: Directory not found or out of API key scope
      tags:
      - Public
      security:
      - apiKey: []
    patch:
      operationId: PublicApiController_updateDirectory
      summary: Update directory configuration
      description: 'Requires `write`. Covers `name`, `listingTypes` and the four `submissionPolicy` switches.


        Added because `listingTypes` was settable only through the Clerk admin surface, so an integration that could provision its own taxonomies, attribute templates and listings still had to stop and ask a human to declare the listing type those listings would use. `submissionPolicy` joined it on 2026-10-01 for the same reason: a headless consumer could not open page comments or close reviews on its own directory.


        PATCH semantics — an absent field is left alone. The two object fields differ, so read this twice: `listingTypes` REPLACES the whole map, so send every type you want to keep, whereas `submissionPolicy` is MERGED, so an absent switch keeps its value and undeclared keys such as `rejectionReasons` survive.


        `slug`, `domain` and the other `*Policy` fields are deliberately NOT settable here; see UpdatePublicDirectoryDto for why.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublicDirectoryDto'
      responses:
        '200':
          description: Directory updated
        '400':
          description: Malformed listingTypes
        '403':
          description: Key lacks the `write` scope
        '409':
          description: Removing a listing type that still has listings. Body lists each type and its count.
      tags:
      - Public
      security:
      - apiKey: []
  /public/v1/me:
    get:
      operationId: PublicApiController_describeKey
      summary: Describe this API key
      description: 'What the key can reach: its account, its scopes, and the directories in range. `scopes: null` means **unrestricted** (a legacy key issued before scopes existed) and is reported verbatim rather than flattened into a list.


        Added because there was previously no way to discover either: callers guessed directory slugs until one returned 200, and probed a deliberately-missing term to tell 403 from 404.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Account, scopes and reachable directories
        '401':
          description: Missing or invalid X-API-Key
      tags:
      - Public
      security:
      - apiKey: []
  /public/v1/directories/{directory}/taxonomies:
    post:
      operationId: PublicApiController_createTaxonomy
      summary: Create a taxonomy
      description: Requires `write`. Returns 409 with the existing record if the slug is taken, so the caller can switch to using it instead of round-tripping to find out.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxonomyDto'
      responses:
        '201':
          description: Taxonomy created
        '403':
          description: Key lacks the `write` scope
        '409':
          description: Slug already used in this directory
      tags:
      - Public
      security:
      - apiKey: []
    get:
      operationId: PublicApiController_listTaxonomies
      summary: List this directory's taxonomies
      description: 'No scope required — taxonomies are schema, and `GET /export` already hands every one of them to any key on the directory.


        Returns each taxonomy with a `termCount`, not its terms. `GET .../taxonomies/:taxonomy/terms` serves those and paginates; inlining them would make the cost of listing four taxonomies depend on the size of the largest, which on a directory with a 9,000-term geography taxonomy is the difference between an index and a timeout.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: Taxonomies, ordered by slug
      tags:
      - Public
      security:
      - apiKey: []
  /public/v1/directories/{directory}/taxonomies/{taxonomy}/terms:
    post:
      operationId: PublicApiController_createTerm
      summary: Create a taxonomy term
      description: 'Requires `write`. **This completes the `resolve-batch` loop** — the docs there describe looping `unmapped` values to create terms or extend synonyms, which was previously impossible with a public key because term creation was admin-only.


        **Nest with `parentSlug`.** `parentTermId` is also accepted for the keys already using it, but no public route returns a term id, so a slug is the only parent reference a caller can actually obtain from this surface. Sending both is a 400. Either way the parent must belong to the same taxonomy.


        Note this route does NOT require the taxonomy to be `hierarchical`, while PATCH does — an asymmetry that predates `parentSlug` and is left as-is rather than tightened under a key that may be relying on it.


        `metadata` carries the conventional `synonyms` array that `resolve` matches against.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      - name: taxonomy
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicCreateTermDto'
      responses:
        '201':
          description: Term created
        '400':
          description: Parent not found in this taxonomy, or both `parentSlug` and `parentTermId` sent
        '403':
          description: Key lacks the `write` scope
        '409':
          description: Term slug already used in this taxonomy
      tags:
      - Public
      security:
      - apiKey: []
    get:
      operationId: PublicApiController_listTaxonomyTerms
      summary: List a taxonomy's terms, with a listing count each
      description: 'The read half of the term API, which was missing. This surface has had term POST, PATCH and DELETE since taxonomy writes shipped, and no GET of any kind — so a term could be created and updated but never listed, and the only way to see what a taxonomy contained was to pull the whole directory root. Convention Grid hit exactly that reworking 66 industry terms.


        **`listingCount` respects your key.** A key without `read:drafts` gets the count of listings it can actually fetch — published, plus drafts whose `publishAt` has passed — and `listingCountIncludesDrafts` says which you were given. This matters more than it sounds: CourseAlmanac holds 14,470 listings and one published, so an unscoped count would render "Golf Courses (14,470)" above a list of one.


        **`parentSlug`, not `parentTermId`.** Slugs are what every other identifier on this surface is, and needing the parent''s UUID is why nesting a term currently takes a second call. `childSlugs` is the same hierarchy from the other side, so a tree can be built without a second pass.


        **Not paginated.** A taxonomy is an operator-curated set: the largest on the platform holds 141 terms and all of them together hold 614. The directory root already returns every term in one payload.


        **To list the listings tagged with a term, use `GET /directories/{directory}/listings?terms={slug}`** — that already exists and takes comma-separated slugs (matching ANY of them).'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      - name: taxonomy
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: The taxonomy and all of its terms
        '401':
          description: Missing or invalid X-API-Key
        '404':
          description: Directory or taxonomy not found
      tags:
      - Public
      security:
      - apiKey: []
  /public/v1/directories/{directory}/turnstile:
    get:
      operationId: PublicApiController_getTurnstile
      summary: Which Turnstile widget verifies this directory's public forms
      description: 'Reports the credentials IN EFFECT, which may be the shared platform widget rather than this directory''s own. `configured: false` with `source: "platform"` is the state worth acting on: that widget issues tokens only on hostnames registered against it, and on any other host the anonymous write endpoints accept every submission and record it as `spam` behind the same 202 they always return. Nothing fails visibly.


        Needs no scope beyond a valid key — the site key is already published in `GET /export` and ships in the HTML of every page carrying the widget. No part of the secret is returned here, unlike the admin route: this surface cannot rotate one, so it has no reason to confirm a rotation.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: Current Turnstile configuration
        '401':
          description: Missing or invalid X-API-Key
        '404':
          description: Directory not found or out of API key scope
      tags:
      - Public
      security:
      - apiKey: []
  /public/v1/directories/{directory}/turnstile/provision:
    post:
      operationId: PublicApiController_provisionTurnstile
      summary: Create or reconcile this directory's own Turnstile widget
      description: 'Requires `write`. Gives the directory a widget of its own on the EpicDirectories Cloudflare account, registered against the `domain` recorded on the directory plus that domain''s `www` alias, and starts serving its site key from `GET /export`. Your next build renders a key that works on your hostname instead of the platform one, which does not.


        Normally nothing needs to call this: an operator recording the `domain` provisions it. It is here for the cases that need a nudge — a directory whose domain predates provisioning, or one whose hostname list was edited in the Cloudflare dashboard and has drifted. It always re-sends the hostname list rather than trusting our own record of it.


        Idempotent, and safe to put in a deploy pipeline: a widget already covering the right hostnames is `unchanged` and costs no Cloudflare call. It refuses to touch a widget registered by hand (`skipped-manual`), and a directory with no `domain` recorded comes back `skipped-no-domain` — ask an operator to record one, as that field is not settable with a key.


        The new widget does NOT reach your visitors until you rebuild. Until then the API verifies against the new secret while your pages still render the old site key, and submissions in between are recorded as spam — so rebuild straight after calling this.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: What was done, plus the same shape as GET
        '401':
          description: Missing or invalid X-API-Key
        '403':
          description: Key lacks the `write` scope
        '404':
          description: Directory not found or out of API key scope
        '503':
          description: Cloudflare could not be used, and nothing was changed. The message is the one to act on; it is usually ours to fix, not yours.
      tags:
      - Public
      security:
      - apiKey: []
  /public/v1/directories/{directory}/attribute-templates:
    post:
      operationId: PublicApiController_createAttributeTemplate
      summary: Create an attribute template
      description: 'Requires `write`. Without this, `PUT .../attributes` rejects every key as unknown, so a public-key integration could never use typed, filterable or sortable attributes and was forced to put everything in free-form `canonicalFields` — where recipes cannot scope on it.


        Uniqueness is per `(directory, listingType, key)`. A null `listingType` means "applies to every type" and can coexist with a same-key type-scoped template, matching how attribute resolution works on write.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttributeTemplateDto'
      responses:
        '201':
          description: Attribute template created
        '403':
          description: Key lacks the `write` scope
        '409':
          description: Key already defined for this listingType
      tags:
      - Public
      security:
      - apiKey: []
    get:
      operationId: PublicApiController_listAttributeTemplates
      summary: List attribute templates
      description: 'No scope required — templates are schema, and `GET /export` already hands every one of them to any key on the directory. Gating the dedicated read while the bulk read is open would protect nothing and cost a caller a 40 MB export to answer "what fields exist".


        `listingType` filters the way attribute RESOLUTION works, not the way the column reads: it returns the type-scoped templates **plus** the type-agnostic ones, which together are exactly the keys `PUT .../attributes` will accept on a listing of that type.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      - name: listingType
        required: false
        in: query
        description: Templates applicable to this listing type, including type-agnostic ones.
        schema:
          type: string
      responses:
        '200':
          description: Templates, ordered by listingType then key
      tags:
      - Public
      security:
      - apiKey: []
  /public/v1/directories/{directory}/attribute-templates/{template}:
    get:
      operationId: PublicApiController_getAttributeTemplate
      summary: Get one attribute template
      description: 'No scope required, for the reason the list route gives.


        `:template` is **either** the template id **or** its `key`. The key form is the one worth using: a consumer that defined `square_footage` knows that name, and should not have to store our uuids to address it again — the same reasoning that makes every listing path here `(listingType, slug)`.


        When you address by key, `?listingType=` picks the scope. **Omitting it means the type-agnostic template specifically, not "whichever one exists".** One key can hold two templates — one scoped to a listing type, one applying to all of them — because the uniqueness constraint has a nullable column in it. A 404 here tells you if the key exists under another scope.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      - name: template
        required: true
        in: path
        schema:
          type: string
      - name: listingType
        required: false
        in: query
        description: Scope to address, when using a key.
        schema:
          type: string
      responses:
        '200':
          description: The template
        '404':
          description: No such template in this scope; the body names where the key does exist
      tags:
      - Public
      security:
      - apiKey: []
    patch:
      operationId: PublicApiController_updateAttributeTemplate
      summary: Update an attribute template
      description: 'Requires `write`. Addressed by id or `key` exactly as the GET above, `?listingType=` and all.


        `key` and `listingType` are **not** settable. Both are part of the identity every stored value was written against and every consumer build reads by name, so moving either is a rename — and renames on this platform get aliases or they get refused. Delete and recreate if that is really the intent.


        Changing `type` is allowed and does **not** rewrite stored values: a `number` turned `enum` leaves numbers sitting behind a vocabulary that does not list them. The admin UI has always allowed this and no read path coerces, so this is not narrower than the UI — but it is worth knowing before doing it to 30,000 listings.


        An empty body is a no-op: it returns the template unchanged and fires nothing, rather than bumping `updatedAt` and rebuilding a consumer site for a request that changed nothing.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      - name: template
        required: true
        in: path
        schema:
          type: string
      - name: listingType
        required: false
        in: query
        description: Scope to address, when using a key.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttributeTemplateDto'
      responses:
        '200':
          description: The updated template
        '403':
          description: Key lacks the `write` scope
        '404':
          description: No such template in this scope
      tags:
      - Public
      security:
      - apiKey: []
    delete:
      operationId: PublicApiController_deleteAttributeTemplate
      summary: Delete an attribute template
      description: 'Requires `write`. Addressed by id or `key`, with `?listingType=` as above.


        **This deletes every value any listing holds for the template.** The foreign key cascades, so one DELETE on a 31,000-listing directory can destroy 31,000 rows, and nothing restores them — `/export` is the only copy and it is yours, not ours.


        So a template that still has values is refused with **409 and the count**; re-send with `?force=true` to confirm the number was expected. A template with no values deletes with no flag, which is the usual case — removing seeded fields a directory never populated needs no ceremony, and a confirmation flag you always send protects nobody.


        The response reports `valuesDeleted`, so a caller who forced it learns the cost rather than reconstructing it from a diff of two exports.'
      parameters:
      - name: Idempotency-Key
        in: header

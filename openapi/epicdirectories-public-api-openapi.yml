      operationId: PublicApiController_listMedia
      summary: List media assets for a listing
      description: 'Returns **every** asset including `pending` and `failed` ones — unlike the read/export endpoints, which only surface `ready` media. This is how you confirm an ingest finished: POST returns `pending`, then poll here until `status` is `ready` (or `failed`, with the reason in `variants.error` when the worker recorded one).'

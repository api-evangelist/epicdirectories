  /public/v1/directories/{directory}/listings/{listingType}/{listingSlug}/media/upload:
    post:
      operationId: PublicApiController_uploadMedia
      summary: Upload an image file directly (multipart)
      description: 'Send the bytes. Use this when the image is not already at a public URL — otherwise prefer `POST .../media`, which takes a `url` and is cheaper for both of us.


        Unlike the URL route this returns `status: "ready"` immediately, because the original is stored before the response; variant generation still runs async.


        **`Idempotency-Key` is rejected here with 400** — the replay hash cannot see the file bytes, so a reused key could not tell two different images apart. Retry without it and DELETE any duplicate.


        `role`, `alt`, `caption` and `sortOrder` may be sent as form fields alongside the file.


        `role` in particular should be set HERE rather than by a follow-up `PATCH`: variant geometry depends on it and variants are enqueued before the response returns, so a role applied afterwards needs an explicit `reprocess` to take effect — two encodes of every byte to reach the state one request could have produced.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).

      - apiKey: []
  /public/v1/directories/{directory}/screening/apply:
    post:
      operationId: PublicApiController_screeningApply
      summary: Tag the flagged listings, and hold the confident ones in draft
      description: 'Writes each verdict as a term in the review taxonomy, creating the taxonomy and only the terms actually earned.


        **Additive.** Terms are written directly, so a listing’s services, industries and regions cannot be touched by this endpoint — unlike `PUT .../terms`, which is replace-all and requires the caller to send every existing term back or destroy it.


        **Self-correcting.** A screening term that no longer applies is removed, so a site that comes back stops being tagged as dead. Only the four screening terms are ever removed; your own review tags are never touched.


        **It never re-publishes.** `site-dead`, `site-parked` and `site-placeholder` pull a published listing back to draft; nothing puts it back, because a listing may have been edited or merged since and silently re-publishing is a change nobody asked for. Recovery is reported and left to a person. Pass `hold: false` for a tag-only pass.


        **Capped, and it converges.** A run writes at most 2,000 listings and reports the rest as `deferred`; call it again to continue. The cap budgets WORK, not listings — anything already carrying the right term and owing no hold is counted in `settled` and does not consume the budget — so repeated calls finish a directory instead of re-doing the same prefix. `deferred: 0` means done; `settled` is how much was already right.


        Send `dryRun: true` to see the counts without writing. It previews both halves — `wouldTag`/`wouldHold` for what would be added, `wouldClear` for what would be removed. Watch `wouldClear`: clearing recovered listings is uncapped and is not drawn from the capped selection, so a converged directory can preview zero tags and still have removals pending.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyScreeningDto'
      responses:
        '201':
          description: Counts of what changed
        '403':
          description: API key is missing the "write" scope
        '404':
          description: Directory not found
      tags:
      - Public
      security:
      - apiKey: []

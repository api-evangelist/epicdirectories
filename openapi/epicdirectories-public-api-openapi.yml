        '401':
          description: Missing or invalid X-API-Key
        '403':
          description: API key is missing the "write" scope
        '404':
          description: Directory not found
      tags:
      - Public
      security:
      - apiKey: []
  /public/v1/directories/{directory}/site-probes/dead-links:
    get:
      operationId: PublicApiController_deadLinks
      summary: Listings whose site is not answering
      description: 'Joins this directory’s listings to the shared probe records.


        **Only `unreachable` counts as dead by default.** A site refusing an automated client — routine behind Cloudflare — is not a broken link, and a report mixing the two teaches an operator to ignore it. 13 of EpicDirectories’ 137 sites answer 403 and are entirely healthy. Pass `includeBlocked=true` to see those as a separate concern.


        `summary.urlsNeverChecked` is the **gap** in the report, not a pass: those URLs have no evidence either way until a sweep has run, and must not be read as healthy. Likewise `listingsWithoutUrl` can never be checked by anything.


        **Every item names the `field` its URL came from**, and `source` says whether that was the listing’s own `canonicalFields` or an attribute opted in through `enrichmentPolicy.linkSweepAttributes`. A listing can carry several URLs, so one listing may produce several items — `summary.deadLinks` counts findings and `summary.affectedListings` counts distinct listings.


        **`liveness: "endpoint"` fields are judged differently.** For a field marked that way in the policy — an API root, typically — any HTTP response of any status proves something is listening, so only an unreachable host or an explicit 410 is dead. A 404 or a 500 at `https://api.example.com/v1` is normal: it is a path prefix, not a resource. `summary.aliveByLivenessRule` counts what that suppressed, so the rule is never invisible.


        **`enrichmentPolicy.linkDeadOn` widens what counts as dead.** By default only an unreachable host is — a URL whose certificate does not cover its own hostname, or which times out, is recorded as `error`/`blocked` and excluded, so it reads as ALIVE. `{ "tls": true }` counts a certificate fault; `{ "timeoutAfter": 2 }` counts a URL that has timed out that many consecutive checks — not one slow response. `summary.deadOn` echoes both, so the report can be read without the config beside it.


        **Neither rule is on by default and neither can be global.** Three Convention Grid listings serve 200 at the apex with a `www.` certificate that does not cover the host; that is the owner’s to fix and that report leaves them out on purpose. Enabling `tls` also does not re-admit the six live sites that answer this crawler from a laptop and not from the worker: those are classified `unknown` and stay out.


        **A row written before failure reasons were recorded is judged the old way**, by outcome alone, and these rules do not fire for it. Guessing a reason from stored error text is the substring match that once filed three live sites as dead domains. The next sweep records it properly.


        **Three summary fields exist to stop a misconfiguration reading as good news.** `unknownAttributeKeys` lists configured keys with no attribute template here (a typo sweeps nothing and looks healthy); `policyProblems` lists unusable policy entries; `unsweepable` lists values no HTTP request can check at all, such as a `wss://` URL — those are neither checked nor broken.


        **A URL queued by a sweep still counts as never-checked.** A `LinkCheck` row is written when the probe finishes, not when it is queued, so polling this endpoint straight after a sweep shows no progress for as long as the queue takes to drain. That is a reporting gap, not a stalled sweep.


        Needs `read:drafts` **or** `write` — a scheduled link check should not require a key that can also delete what it is checking.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. Send a unique key per logical operation to make retries safe. 1-256 characters, and **only** letters, digits, `-` and `_` — colons and other separators are rejected with 400. A retry with the same key replays the original response (status + body) instead of re-executing. Cached for 24h. Reusing a key with a different request body returns 409 — note that a timestamp in the body (e.g. `fetchedAt`) turns an otherwise-stable key into a permanent 409, so either omit it (snapshots default it server-side) or fold a payload digest into the key. Skipped on 5xx responses (transient errors should be retried fresh).
        required: false
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API Key for authentication
        required: true
        schema:
          type: string
      - name: directory
        required: true
        in: path
        schema:
          type: string
      - name: includeBlocked
        required: false
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Affected listings plus a coverage summary
        '403':
          description: API key holds neither "read:drafts" nor "write"
        '404':
          description: Directory not found
      tags:
      - Public
      security:
      - apiKey: []
  /public/v1/directories/{directory}/screenshots:
    post:
      operationId: PublicApiController_sweepScreenshots
      summary: Queue homepage screenshots for this directory’s listings
      description: 'Captures each listing’s own website and attaches the result as a `site_screenshot` media asset, which gets the extra 400x267 `site` variant cropped from the top. Ordinary media from there on — it appears in listing reads and sorts below anything an editor chose.


        **Asynchronous.** The response reports what was queued, not what was captured; poll `GET .../screenshots` for coverage.



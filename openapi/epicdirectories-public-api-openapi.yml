      description: 'Reads each listing’s website and writes what it finds into typed attributes prefixed by source — `site_title`, `site_description`, `site_og_image`, `site_headings`, `site_text_excerpt` and the rest. Intended as **seed material for writing your own copy**, not as text to publish: it is what the business says about itself, gathered verbatim.



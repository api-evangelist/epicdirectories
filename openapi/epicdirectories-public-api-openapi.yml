      - name: listingType
        required: true
        in: path
        schema:
          type: string
      - name: listingSlug
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                role:
                  type: string
                  enum:
                  - hero
                  - thumbnail
                  - gallery
                  - logo
                  - site_screenshot
                  - site_og
                  description: Asset role.
                alt:

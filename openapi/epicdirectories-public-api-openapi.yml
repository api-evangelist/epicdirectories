      description: 'Edit term-level metadata (synonyms, seoKeywords, relatedTopics, description, etc.) without round-tripping through the admin UI. Body matches the admin UpdateTermDto shape — see /v1/.../taxonomies/:tax/terms/:term for the full field list.


